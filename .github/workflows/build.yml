name: Build member 4 preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure offline dependencies
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package executable and runtime files
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package
      - name: Upload member 4 preview
        uses: actions/upload-artifact@v4
        with:
          name: ServerRoom-Member4-${{ runner.os }}-${{ runner.arch }}
          path: build/package/*.zip
          if-no-files-found: error
